name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data and build the database
        run: python scripts/build.py
      - name: Check the generated MySQL seed is up to date
        run: git diff --exit-code db/mysql/seed.sql
      - name: Run the sample queries against the SQLite build
        run: |
          python - <<'EOF'
          import re, sqlite3
          con = sqlite3.connect('web/oil_leaks.db')
          sql = open('db/queries.sql').read()
          blocks = [b for b in re.split(r'\n(?=-- Q\d+:)', sql) if b.startswith('-- Q')]
          for b in blocks:
              con.execute(b).fetchall()
          print(f'{len(blocks)} sample queries OK')
          EOF
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
